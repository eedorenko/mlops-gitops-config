image: ghcr.io/eedorenko/mlops-gitops/chicken_detection_model_automl:$IMAGE_TAG
serviceAccountName: chicken-detection-sa
task:
  name: entree-detection 
  type: object_detection
  model:
    class_mapping: |+
        {0: raw_chicken_wing, 1:raw_chicken_thigh,
        2:raw_chicken_drum, 3:raw_chicken_breast, 
        4: cooked_chicken_wing, 5: cooked_chicken_thigh, 
        6: cooked_chicken_drum, 7:cooked_chicken_breast}

    confidence_threshold: "0.65"
  worker:
    operating_fps: "6"
    tracker: 
      name: norfair
      distance_function: "kou"
      distance_threshold: "0.75"
